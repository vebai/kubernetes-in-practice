apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app.kubernetes.io/name: flask-app
spec:
  replicas: 3
  minReadySeconds: 5
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-app
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: flask
          image: flask-app:v1.0.0
          imagePullPolicy: Never
          env:
            - name: APP_NAME
              value: flask-app
            - name: APP_VERSION
              value: v1.0.0
            - name: APP_MESSAGE
              value: Hello from Kubernetes
          ports:
            - name: http
              containerPort: 5000
