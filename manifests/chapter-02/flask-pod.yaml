apiVersion: v1
kind: Pod
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  containers:
    - name: flask-app
      image: flask-app:v1.0.0
      imagePullPolicy: Never
      env:
        - name: APP_NAME
          value: flask-app
        - name: APP_VERSION
          value: v1.0.0
        - name: APP_MESSAGE
          value: Hello from Kubernetes
      ports:
        - containerPort: 5000
