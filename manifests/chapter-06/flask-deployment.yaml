apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 3
  minReadySeconds: 5
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-app
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: flask
        image: flask-app:v2.2.0
        imagePullPolicy: Never
        env:
        - name: APP_NAME
          value: flask-app
        - name: APP_VERSION
          value: v2.2.0
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: flask-config
              key: APP_MESSAGE
        - name: STARTUP_DELAY_SECONDS
          valueFrom:
            configMapKeyRef:
              name: flask-config
              key: STARTUP_DELAY_SECONDS
        - name: WORK_ITERATIONS
          valueFrom:
            configMapKeyRef:
              name: flask-config
              key: WORK_ITERATIONS
        ports:
        - name: http
          containerPort: 5000
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          failureThreshold: 30
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
