image:
  tag: "v2.3.0"
  pullPolicy: IfNotPresent

config:
  appMessage: "Hello from production"
  startupDelaySeconds: "0"

secret:
  existingSecret: ""

ingress:
  enabled: true
  className: alb
  path: /
  pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
