replicaCount: 2

image:
  repository: flask-app
  tag: "v2.3.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

config:
  appMessage: "Hello from Helm"
  startupDelaySeconds: "0"

secret:
  existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: false
  annotations: {}
  className: alb
  path: /
  pathType: Prefix

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: false
  minAvailable: 1

# Enable only for the multi-zone capstone exercise.
topologySpread:
  enabled: false
